name: car_shop
description: "A new Flutter project."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  intl: ^0.20.2
  conditional_builder_null_safety: ^0.0.6
  flutter_bloc: ^9.1.1
  dio: ^5.8.0+1
  hexcolor: ^3.0.1
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  fluttertoast: ^8.2.12
  carousel_slider: ^5.1.1
  image_picker: ^1.2.4
  webview_flutter: ^4.14.1
  #firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  supabase_flutter: ^2.10.3
  firebase_messaging: ^16.0.3
  desktop_window: ^0.4.2
  responsive_framework: ^1.5.1
  get_it: ^8.0.2
  rxdart: ^0.28.0
  equatable: ^3.0.0
  collection: ^1.19.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  
  uses-material-design: true

  assets:
    - assets/cars/
    - assets/brands/
  fonts:
    - family: Abril
      fonts:
        - asset: assets/fonts/AbrilFatface-Regular.ttf
    - family: jannah
      fonts:
        - asset: assets/fonts/jannah.ttf
    - family: IconBroken
      fonts:
        - asset: assets/fonts/icons.ttf

